[package]
name = "aa_language_model"
version = "0.1.0"
edition = "2024"

# 只有 IR + trait。**不依赖 reqwest**：wire 适配在 `aa_ai_*` crate，
# 见 `docs/design/crate-layout.md`。
[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# 离线 stub provider（`stub::StubClient`）。默认关闭：生产构建不需要测试替身。
# 汇总 crate 的 `stub` feature 会转发到这里。
stub = []
