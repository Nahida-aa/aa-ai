[package]
name = "aa_ai_openrouter"
version = "0.1.0"
edition = "2024"

# 一家 provider 一个 crate：只有这里认识 OpenRouter 的 JSON 字段。
#
# 不依赖 `aa_ai_openai`：两家共享的是「OpenAI chat completions 的形状」，
# 不是实现。OpenRouter 的 assistant 消息多出 `reasoning` / `reasoning_details`，
# 错误体、模型列表、思考配置也都不同；把 encoder 借过来会逼着协议 crate 长分支
# （见 docs/decisions/0012-openrouter-vendor.md）。
[dependencies]
aa_language_model.workspace = true
aa_http_client.workspace = true
base64.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
aa_reqwest_client.workspace = true
